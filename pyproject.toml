[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-guard"
version = "0.1.0"
description = "User Story Health Agent, phase 1"
requires-python = ">=3.12"
dependencies = ["reportlab>=4.2,<5","langgraph>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
story-guard = "story_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
